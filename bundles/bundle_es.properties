# productores:

block.fenadi-PRA0-elasticity-fuser.name = Fusor de Elasticidad
block.fenadi-PRA0-elasticity-fuser.description = Produce Fibra Elástica a partir de unir la dureza del Tinio con la flexibilidad de la Masa Básica. 
block.fenadi-PRA1-molding-machine.name = Moldeadora
block.fenadi-PRA1-molding-machine.description = Crea Masa Básica a partir de pulverizar un montón de escombros.
block.fenadi-PRA2-decompressor.name = Descompresor
block.fenadi-PRA2-decompressor.description = Extrae recursos básicos a partir de un montón de escombros.
block.fenadi-PRA3-furnace-ferocity.name = Horno de Ferocidad
block.fenadi-PRA3-furnace-ferocity.description = Fusiona la dureza del Tinio y la fragilidad de la Cristalia para producir Lizandri.
block.fenadi-PRA4-casting-chamber.name = Cámara de Fundición
block.fenadi-PRA4-casting-chamber.description = Derrite materiales blandos para producir Yavama.
block.fenadi-PRA5-igneous-concentrator.name = Concentrador Ígneo
block.fenadi-PRA5-igneous-concentrator.description = Recolecta el Soro de la atmosfera y lo convierte en liquido. Funciona mejor en terreno caliente.
block.fenadi-PRA6-corrosive-concentrator.name = Concentrador Corrosivo
block.fenadi-PRA6-corrosive-concentrator.description = Recolecta la Baruga del subsuelo y lo convierte en liquido. Funciona mejor en terreno radiactivo.
block.fenadi-PRA7-mass-hydrator.name = Hidratador de Masa
block.fenadi-PRA7-mass-hydrator.description = Hidrata grandes cantidades de masa basica disecada con la ayuda de la viscosidad de la Yavama.
block.fenadi-PRA8-corrosive-ionizer.name = Ionizador Corrosivo
block.fenadi-PRA8-corrosive-ionizer.description = Ioniza en grandes cantidades de cristalia drenada gracias a la ayuda de la corrosividad de la Baruga.
block.fenadi-PRA9-liquid-press.name = Prensa de Líquidos
block.fenadi-PRA9-liquid-press.description = Mezcla el Soro, la Baruga y tritura algunos cristales en un liquido ligero y refrescante para estructuras defensivas.
block.fenadi-PRB0-advanced-synthesizer.name = Sintetizador Avanzado
block.fenadi-PRB0-advanced-synthesizer.description = Solidifica la masa y la transforma a una mas densa. Requiere Soro para funcionar.
block.fenadi-PRB1-intensive-blender.name = Licuadora Intensiva
block.fenadi-PRB1-intensive-blender.description =  Licúa el Soro con cristales y produce un potentisimo liquido con capacidades explosivas.
block.fenadi-PRB2-plasticizer.name = Plastiquidora
block.fenadi-PRB2-plasticizer.description = Produce más Fibra Elástica a cambio de consumir más materiales. Tambien produce Yavama como subproducto.
block.fenadi-PRB3-aggressive-forge.name = Forja de Agresividad
block.fenadi-PRB3-aggressive-forge.description = Produce más Lizandri a cambio de consumir más materiales.
block.fenadi-PRB4-viscosity-blender.name = Licuadora Viscosa
block.fenadi-PRB4-viscosity-blender.description = Derrite materiales blandos con mucha más rapidez y eficacia para producir más Yavama.
block.fenadi-PRB5-precision-fuser.name = Fusor de Precisión
block.fenadi-PRB5-precision-fuser.description = Mejora significativamente la Fibra Elástica y la sobrecarga a Fibra Óptica. Requiere Soro para funcionar.
block.fenadi-PRB6-toxicity-mixer.name = Mezclador de Toxinas
block.fenadi-PRB6-toxicity-mixer.description = Mezcla materiales radioactivos con líquidos nocivos.
block.fenadi-PRB7-golden-purifier.name = Purificadora Dorada
block.fenadi-PRB7-golden-purifier.description = Limpia el oro impuro recolectado de las meseta a un oro mas aceptable.
block.fenadi-PRB8-igneous-furnace.name = Horno Ígneo
block.fenadi-PRB8-igneous-furnace.description = Calienta en grandes cantidades la cristalia ígnea apagada con la ayuda de la agresividad del Líquido Explosivo.
block.fenadi-PRB9-liquid-refinery.name = Refinería de Liquidos
block.fenadi-PRB9-liquid-refinery.description = Una version mejorada de la prensa que crea mas Líquido Radiante a cambio de consumir mas recursos.
block.fenadi-PRC0-complex-synthesizer.name = Sintetizador Complejo
block.fenadi-PRC0-complex-synthesizer.description = El sintetizador definitivo, crea una masa increíblemente resistente. Produce líquido residual como subproducto.
block.fenadi-PRC1-impact-filter.name = Filtrador de Impacto
block.fenadi-PRC1-impact-filter.description = Extrae recursos valiosos de enormes cantidades de escombros.
block.fenadi-PRC2-otucium-collider.name = Colisionador de Otucio
block.fenadi-PRC2-otucium-collider.description = Produce un robusto material a partir de elementos inflamables y radioactivos. Produce líquido residual como subproducto.
block.fenadi-PRC3-reflective-chamber.name = Cámara Reflectante
block.fenadi-PRC3-reflective-chamber.description = Produce más Fibra Optica a cambio de consumir más materiales.
block.fenadi-PRC4-logical-catalyst.name = Catalizador Lógico
block.fenadi-PRC4-logical-catalyst.description = Fabrica un procesador con increíbles capacidades.
block.fenadi-PRC5-complex-fuser.name = Fusor Complejo
block.fenadi-PRC5-complex-fuser.description = Perfecciona la Fibra Óptica y la somete a entornos extremos para crear Fibra Compleja. Produce mucho líquido residual como subproducto.
block.fenadi-PRC6-quantum-catalyst.name = Catalizador Cuántico
block.fenadi-PRC6-quantum-catalyst.description = Fabrica un poderoso y complejo procesador que puede emplearse de múltiples usos.

