block.fenadi-DRA0-basic-drill.name = Taladro Básico
block.fenadi-DRA0-basic-drill.description = Extrae minerales básicos.
block.fenadi-DRA1-elastic-drill.name = Taladro Elástico
block.fenadi-DRA1-elastic-drill.description = Extrae sutilmente algunos minerales básicos.
block.fenadi-DRB0-advanced-drill.name = Taladro Avanzado
block.fenadi-DRB0-advanced-drill.description = Extrae minerales más sofisticados.
block.fenadi-DRB1-optical-drill.name = Taladro Óptico
block.fenadi-DRB1-optical-drill.description = Extrae rápidamente minerales fragiles.
block.fenadi-DRB2-basic-hole-punch.name = Perforadora básica
block.fenadi-DRB2-basic-hole-punch.description = Extrae algunos minerales básicos de las paredes.
block.fenadi-DRC0-complex-drill.name = Taladro Complejo
block.fenadi-DRC0-complex-drill.description = Extrae todos los minerales duros
block.fenadi-DRC1-golden-hole-punch.name = Perforadora Dorada
block.fenadi-DRC1-golden-hole-punch.description = Extrae grandes cantidades de minerales de las paredes

# torretas:

block.fenadi-TA0-guard.name = Guardia
block.fenadi-TA0-guard.description = Dispara proyectiles básicos a todos los objetivos.
block.fenadi-TA1-splatter.name = Salpicador
block.fenadi-TA1-splatter.description = Dispara proyectiles explosivos que abarcan un gran area a objetivos terrestres.
block.fenadi-TA2-fragmenter.name = Fragmentador
block.fenadi-TA2-fragmenter.description = Dispara proyectiles perforantes de gran alcance a todos los objetivos.
block.fenadi-TA3-voltage.name = Voltage
block.fenadi-TA3-voltage.description = Libera varios arcos eléctricos a todos los objetivos. Requiere energía. 
block.fenadi-TB0-radiation.name = Radiador
block.fenadi-TB0-radiation.description = Descompone los materiales radiactivos, liberando sus partículas sobre una gran area a objetivos terrestres. Requiere Baruga para la descomposición.
block.fenadi-TB1-optical.name = Óptica
block.fenadi-TB1-optical.description = Almacena material eléctrico para disparar un laser de gran precisión que persigue a todos los objetivos. Requiere energía.
block.fenadi-TB2-plasm.name = Plasma
block.fenadi-TB2-plasm.description = Carga un poderoso rayo laser perforante a todos los objetivos. Requiere energía y refrigerante.
block.fenadi-TB3-rehash.name = Refrito
block.fenadi-TB3-rehash.description = Escupe un poderoso lanzallama que carboniza todo lo que se le cruce. Requiere Líquido Explosivo.
block.fenadi-TB4-butcher.name = Carnicero
block.fenadi-TB4-butcher.description = Dispara un potente proyectil explosivo que aniquila a todas las unidades terrestres, pero tiene la desventaja de un punto ciego y una lenta recarga. Requiere Líquido Explosivo.
block.fenadi-TB5-descend.name = Descendedor
block.fenadi-TB5-descend.description = Dispara una feroz ráfaga de proyectiles antiaéreos.
block.fenadi-TC0-angfum.name = Angfum
block.fenadi-TC0-angfum.description = Depediendo de la munición, atacará de manera diferente a todos los objetivos.
block.fenadi-TC0-angfum.details = Se le otorgó ese nombre en honor al "dios de la versatilidad", proveniente de la cultura de los Primigenio. Se decía que Angfum se adaptaba a cualquier conflicto que se presentarse y que su poder aumentaba mientras la pelea se prolongaba. Fue vencido por el dios del desorden: Velenza.
block.fenadi-TC1-frugjad.name = Frugjad
block.fenadi-TC1-frugjad.description = Dependiendo del líquido, atacará de manera diferentes a todos los objetivos. 
block.fenadi-TC1-frugjad.details = Se le otorgó ese nombre al antiguo "dios de la imparcialidad", retratado como un ejemplo a seguir para los Primigenios. Se rumorea que esta deidad causó una purificación masiva de injusticia a niveles inimaginables que todos comenzaron a idolatrarlo. Fue vencido por el dios de las catastrofes: Macay.
block.fenadi-TC2-macay.name = Macay
block.fenadi-TC2-macay.description = Dependiendo de la munición, los misiles atacará de una manera diferentes a todos los objetivos. Requiere Líquido Explosivo para funcionar.
block.fenadi-TC2-macay.details = Se le otorgó ese nombre en consecuencia del posible regreso del "dios de las catastrofes", una deidad muy temida en la sociedad de los Primigenios. A diferencias de los demás dioses, esta entidad no representaba nada y ni otorgaba ningún beneficio venerarla ni rendirle culto. Al descubrir lo que hizo Frugjad sobre una "limpieza absoluta", fue a confrontarlo y evitar que Velenza se enojara por tales actos buenistas. Obendencia absoluta hacia Velenza. 
block.fenadi-TC3-velenza.name = Velenza
block.fenadi-TC3-velenza.description = Dispara balas de energía hipercargadas de antimateria a todos los objetivos. Requiere muchisima energía y materiales de excelente calidad para funcionar. 
block.fenadi-TC3-velenza.details = Se le otorgó ese nombre en un acto de obedencia absoluta al "dios del desorden", de la entidades mas veneradas y sagrada de la civilización de los Primigenios. Velenza quería de manera indirecta darle grandeza y prosperidad a sus seguidores que profesaban con gran afán la destrucción, exterminio, conquista y caos galáctico, para compensar a sus fieles creyentes le susurraba conocimiento, poder e ideas revolucionarias para que se súperdesarrollara y pasaran de una simple civilización orgánica y organizada a un gigantesco y complejo ente interconectado a muchísimas facciones que causaran la mayor cantidad de caos posible. Fue vencido por... en... la... 

