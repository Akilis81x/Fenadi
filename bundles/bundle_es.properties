# unidades:

unit.fenadi-UD0-advocate.name = [yellow]Defensor
unit.fenadi-UD0-advocate.description = Unidad básica insignia en inicio de asedios. Dispara proyectiles básicos.    
unit.fenadi-UE0-sentinel.name = [yellow]Centinela
unit.fenadi-UE0-sentinel.description = Unidad estándar preparada con una escopeta que hace un daño considerable a bloques enemigos.
unit.fenadi-UF0-vigilant.name = [yellow]Vigilante
unit.fenadi-UF0-vigilant.description = Unidad mejorada equipada con una escopeta mas óptima que perfora.
unit.fenadi-UG0-protective.name = [yellow]Protector
unit.fenadi-UG0-protective.description = Unidad avanzada que posee un escudo que protege otras unidades, además de una ametralladora y orbes eléctricos. 
unit.fenadi-UH0-segurity.name = [yellow]Seguridad
unit.fenadi-UH0-segurity.description = Unidad de gran tamaño, compuesta de unos enormes brazos capaces de destruir en segundos bloques enemigos. Pierde el control una vez ataca.
unit.fenadi-UI0-guardian.name = [yellow]Guardian
unit.fenadi-UI0-guardian.description = [red]El fin se acerca[]. La destrucción ensamblada, unidad gigatesca que desintegra todo lo que toca. Pierde el control una vez ataca.
unit.fenadi-UD1-employee.name = [green]Empleado
unit.fenadi-UD1-employee.description = Unidad minuscula de ayuda. No hay dinero suficiente para un propulsor.
unit.fenadi-UE1-assistant.name = [green]Asistente
unit.fenadi-UE1-assistant.description = Unidad pequeña de ayuda. Se gastó todos sus ahorros en cosas innecesarias y no tiene para comprar un propulsor.
unit.fenadi-UF1-collector.name = [green]Recolector
unit.fenadi-UF1-collector.description = Unidad estandar de ayuda, equipada con pistolas dobles y gracias al esfuerzo consiguió un propusor ligero.
unit.fenadi-UG1-supervisor.name = [green]Supervisor
unit.fenadi-UG1-supervisor.description = Unidad avanzada de ayuda, equipada con un lanzamisiles curativo y con un rápido propulsor.
unit.fenadi-UH1-manager.name = [green]Manager
unit.fenadi-UH1-manager.description = Gran unidad de ayuda, equipada con un poderoso propulsor y lanzamisiles curativos que empujan a los enemigos.
unit.fenadi-UI1-vice.name = [green]Vice
unit.fenadi-UI1-vice.description =
unit.fenadi-UD2-lure.name = [orange]Señuelo
unit.fenadi-UD2-lure.description = Pequeña unidad vehicular, rápido con leve poder de daño.
unit.fenadi-UE2-sturdy.name = [orange]Robusto
unit.fenadi-UE2-sturdy.description = Tanque de asedio de rendimiento normal, tiene un cañon que perfora bloques.
unit.fenadi-UF2-collapsor.name = [orange]Colapsador
unit.fenadi-UF2-collapsor.description = Unidad vehicular estándar, rapido con gran poder destructivo.
unit.fenadi-UG2-heavy.name = [orange]Pesado
unit.fenadi-UG2-heavy.description = Tanque de gran tamaño y potencia de fuego, un rendimiento excelente en asediar bases enemigas.
unit.fenadi-UH2-fissure.name = [orange]Fisura
unit.fenadi-UH2-fissure.description = Gran vehiculo, genera ondas de impactos a su alrededor que desintengra todo lo que alcance.
unit.fenadi-UI2-ton.name = [orange]Tonelada
unit.fenadi-UI2-ton.description = [red]no hay esperanza de sobrevivir[]. Gigatesco tanque, equipado con 2 lanzamisiles potente que arrasa con todo aquel que detecte.
unit.fenadi-UD3-climber.name = [cyan]Trepador
unit.fenadi-UD3-climber.description = Pequeña unidad trepante, equipada con un laser perforante. Atraviesa el terreno irregular con cierta dificultad.
unit.fenadi-UE3-looter.name = [cyan]Saqueador
unit.fenadi-UE3-looter.description = Unidad estándar trepante, posee 2 brazos metalicos cuerpo a cuerpo. Atraviesa el terreno irregular con algo de facilidad.
unit.fenadi-UF3-hunter.name = [cyan]Cazador
unit.fenadi-UF3-hunter.description = Unidad mejorada trepante, ahora con laseres perforantes igneos. Atraviesa el terreno irregular casi sin problemas.
unit.fenadi-UG3-muffler.name = [cyan]Silenciador
unit.fenadi-UG3-muffler.description = Unidad trepante avanzada, equipada con un mortifero cañon de racimo de explosivos igneos. Atraviesa el terreno irregular sin tanta preocupación.
unit.fenadi-UH3-dismantler.name = [cyan]Desmantelador
unit.fenadi-UH3-dismantler.description = Gran unidad trepante, tiene un gran cañon de plasma igneo perforante. 
unit.fenadi-UI3-claw.name = [cyan]Agarrador
unit.fenadi-UI3-claw.description = [red]exterminio eminente[]. Una unidad que no sigue ordenes de paz, la paz se consigue destruyendolo todo a su paso.
unit.fenadi-UD4-sum.name = [red]Sum
unit.fenadi-UD4-sum.description = Minuscula unidad aerea, rapida y eficaz aunque debil.
unit.fenadi-UE4-multi.name = [red]Multi
unit.fenadi-UE4-multi.description = Pequeña unidad aerea de asedio, rapida y con una cadencia de fuego mejor a los bloques enemigos.
unit.fenadi-UF4-tentra.name = [red]Tentra
unit.fenadi-UF4-tentra.description = Unidad aerea mejorada, grande, destructiva, caotica y porta un pequeño escuadron en su interior, esperando que destruyan la nave para liberase y causar el caos.
unit.fenadi-UG4-penta.name = [red]Penta
unit.fenadi-UG4-penta.description = Gran unidad aerea, gran capacidad destructiva y porta un escuadron de la muerte en su interior.
unit.fenadi-UH4-potenial.name = [red]Potenial
unit.fenadi-UH4-potenial.description = Dron de considerable tamaño, con rayos laseres letales. Despliega una parejas de Protectores al ser derribado para sortear las defensas antiaereas.
unit.fenadi-UI4-omnidrial.name = [red]Omnidrial
unit.fenadi-UI4-omnidrial.description = [red]no vale la pena pelear[]. Gigantesco dron que gobierna todo el espacio aereo sin compasion alguna (si es que tuviese).

# sectores:

sector.fenadi-s01-isolated-valley.name = Valle Aislado.
sector.fenadi-s01-isolated-valley.description = Un terreno ideal para recuperar tecnología en secreto y liberar el planeta de influencias extranjeras.
sector.fenadi-s01-isolated-valley.details = el planeta Fenadi era un sitio inhóspito e inhabitable por criaturas avanzadas durante eones, hasta la llegada de la federación conquistadora FIOP (Federación Invasora de Orden Primordial) hacia el planeta, desplegaron 7 facciones en distintas especialidades para cumplir las directrices dadas por sus superiores llamados los "Primigenios".
sector.fenadi-s02-abandoned-storage-area.name = Zona de Almacenamiento Abandonado.
sector.fenadi-s02-abandoned-storage-area.description = Antiguo lugar de almacenamiento que alguna vez le perteneció a la facción recolectora [blue]Uwile[], ahora es un sitio completamente olvidado. Investiga la Fibra Elástica para el desarrollo de componentes eléctricos y unitarios.
sector.fenadi-s02-abandoned-storage-area.details = En la Era 1: Incursión, una vez que se establecieron las distintas facciones, la facción recolectora [blue]Uwile[] se le encargó la tarea de instalar almacenes y administras todos los recursos que recibía para todas las zonas centrales y guardar los recursos necesarios que le enviaba los Primigenios desde la Estación de Comando Planetario.
sector.fenadi-s03-tinium-cliff.name = Acantilados de Tinio.
sector.fenadi-s03-tinium-cliff.description = Este terreno alguna vez fue un lugar ideal para extraer cantidades absurdas de Tinio, ahora solo quedan restos de escombros de antiguas infraestructuras de extractores, encuentrarle una utilidad.
sector.fenadi-s03-tinium-cliff.details = En la Era 1: Incursión, la facción rastreadora [orange]Dengar[] se desplegó por todo el planeta para localizar recursos y zonas de interes para los Primigenios. En su busqueda se encontraron con un valioso recursos aunque algo básico; el Tinio, bastante resistente y ligero que abunda en toda la superficie de Fenadi junto con la Masa Basica. Durante este periodo fue de gran utilidad el descubrimiento para el avance tecnológico.
sector.fenadi-s04-crystallized-rift.name = Grieta Cristalizada.
sector.fenadi-s04-crystallized-rift.description = Una región completamente alejadas de las demás, un bioma cristalizado que ofrece multiples aplicaciones, esta protegida por una pequeña base que resguarda las cualidades que brinda la Cristalia.
sector.fenadi-s04-crystallized-rift.details = Durante la Era 1: Incursión, la facción rastreadora [orange]Dengar[] estaba cumpliendo su mision de explorar todos los rincones insólito del nuevo planeta hasta que se encontró con un bioma raro a los demás; uno completamentamente cristalizado y que desprendía leves niveles de radiación, este hallazgo impresionó a todos.
sector.fenadi-s05-corrupt-pit.name = Fosa Corrupta.
sector.fenadi-s05-corrupt-pit.description = Los antiguos registros que una vez llegaste a realizar, muestran la experimentación de crear aleaciones capaces de transportar líquidos para mejorar la calidad de vida de las maquinas, se requiere una variedad amplia de unidades para acabar con esta base enemiga que produce Lizandri.
sector.fenadi-s05-corrupt-pit.details = Durante la Era 2: Investigación, la facción investigadora [purple]Trefim[] estaba analizando todo el terreno planetario para enviar un informe a sus lideres hasta que se encuentró con algo muy inusual: un brote nocivo que se expandía a todo lo que estuviese en su alcance y que surgía desde el interior del planeta. Sin ningún tipo de explicación posible se dispuso a investigar este raro fenómeno y aunque todavía no hay una respuesta clara antes este suceso, si hay algunas cosas que pudieron aclararse: en un principio se le llamó simplemente "corrupción" y no era causada por la conquista de este mundo y mucho menos la gran actividad industrial, esta corrupción es generada naturalmente por el nucleo del planeta y aproximadamente comenzo a surgir hace eones, época en que los Ryjux iniciaron a evolucionar y volverse la especie gobernante del planeta. Aún se desconoce porque Fenadi produce esta "corrupción" que es dañina para sí misma.  
sector.fenadi-s06-collapsed-retaining-wall.name = Muralla de Contención Colapsada.
sector.fenadi-s06-collapsed-retaining-wall.description = Ahora lo que queda de estos puestos son puras ruinas que fueron arrasadas, según un registro que se pudo salvar, se puede recuperar un apreciado líquido de gran utilidad llamado "Yavama".
sector.fenadi-s06-collapsed-retaining-wall.details = Durante la Era 1: Incursion, las facción asaltadora [rose]Oay[] y la protectora [green]Yatro[] se aliaron para establecer numerosos puesto de avanzada en varias partes del planetas para contener la amenaza de "Ryjux", criaturas autónomas de Fenadi. Estos seres, gracias a su fuerza y capacidad de reproducción rápida, se volvieron los únicos seres vivos que gobernaba este cuerpo celeste antes de la llegada de la FIOP. 
sector.fenadi-s07-chemical-synthesis-plant.name = Planta de Química de Sintetización.
sector.fenadi-s07-chemical-synthesis-plant.description = En este zona industrial repleta de yacimientos naturales de Yavama, fue el lugar donde se descubrió otros 2 líquidos naturales del planetas: el Soro y la Baruga. Hazte con ellas y toma control del territorio.
sector.fenadi-s07-chemical-synthesis-plant.details = Mientras la demás facciones comenzaron a establecerse en el cuerpo celeste, hallaron una peculiaridad que contenía el planeta ; la existencia de 2 importatísimos líquidos: el Soro y la Baruga, con características hasta áquel momento únicas: uno es increíblemente inflamable pero funciona como un gran potenciador hacias otros recursos y el otro es muy corrosivo pero es capaz de controlar la radiactividad que genera algunos recursos. Su descubrimiento desbloqueó un nuevo nivel de procesamiento y reacción con los otros recursos.
sector.fenadi-s08-basic-operations-center.name = Centro de Operaciones Básicas.
sector.fenadi-s08-basic-operations-center.description = Mediante pasaba el tiempo y la experimentación continúa de nuevas tecnologías y recursos, surgió la necesidad de obtener mejores estructuras y que ofrecieran muchas más ventajas, así que crearon la imprescindible "Masa Avanzada".
sector.fenadi-s08-basic-operations-center.details = A finales de la Era 1: Incursión, la ocupación global empezó a complicarse cada vez mas por la agresividad e intensidad de los Ryjux y no se sabía con certeza de dónde provenía en masa estas criaturas. Antes esta amenaza, los Primigenios ordenaron la creación de zonas de agrupaciones llamadas "centros operaciones" y "centros de controles", el primero se encargaría se agrupar la mayor cantidad posible de unidades y la otra de ordenar ataques planificados y establecer estrategías letales contra estas criaturas y posibles "futuras amenazas". A su vez, estas instalaciones sirve como puestos fronterizos con otros sectores de gran importancia. 
sector.fenadi-s09-geothermal-post.name = Puesto Geotermal
sector.fenadi-s09-geothermal-post.description = En esta zona volcánica que esta siendo custodiada por un asentamiento enemigo, hay la presencia de la Cristalia Ígnea, un mineral muy importante en todos los aspectos posibles si deseas desarrollar una gran presión hacía tus rivales. 
sector.fenadi-s09-geothermal-post.details = Durante la Era 1: Incursión, tras el increíble descubrimiento del Soro y la Baruga, había curiosidad de que si existiese más misterios de ese estilo con cualidades particulares, en cierta parte del planeta encontraron yacimientos de una variante ardiente de la Cristalia en varias fosas volcánicas. En este punto de no retorno, los conflictos entre facciones iniciarían y a su vez, sus lideres estarían llevando a cabo un proyecto muy ambicioso. 
sector.fenadi-s10-thermal-port.name = Puerto Termal
sector.fenadi-s10-thermal-port.description = En esta brecha volcánica se encuentra establecido un puerto de aeronaves enemigas y tiene a su disposición el MUY PELIGROSO Líquido Explosivo, mucha precausión.
sector.fenadi-s10-thermal-port.details = Mientras mas logros tecnológicos conseguían desarrollar las distintas facciones para contentar a sus lideres, hubo un leve roce entre la extinta facción investigadora [purple]Trefim[] y la sobreviviente facción industrializadora [cyan]Kiak[], los Primigenios aprovecharon dicha indiferencia y le pidió clandestinamente a la facción productora [yellow]Galkeo (tu)[] crear un poderoso líquido con un poder explosivo y devastador para cualquiera que lo crease, para poder amenazarlos y contrarestar una posible guerra en medio de plena conquista mundial.
