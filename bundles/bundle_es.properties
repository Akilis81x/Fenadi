# artículos:

item.fenadi-i01-basic-mass.name = Masa Basica
item.fenadi-i01-basic-mass.description = Un recurso blando y extraíble, abundante en todo Fenadi, utilizado para todas las construcciones básicas.
item.fenadi-i02-tinium.name = Tinio
item.fenadi-i02-tinium.description = Se utiliza como munición de ralentización, transporte de recursos, fabricación de unidades y estructuras defensivas. Bastante resistente.
item.fenadi-i03-elastic-fiber.name = Fibra Elastica
item.fenadi-i03-elastic-fiber.description = Se utiliza en la fabricación de unidades, infraestructura eléctrica y sistemas de almacenamiento. Es muy flexible.
item.fenadi-i04-debris.name = Escombros
item.fenadi-i04-debris.description = Se pueden separar en fragmentos de otros recursos comprimidos para obtenerlos.
item.fenadi-i05-crystalia.name = Cristalia
item.fenadi-i05-crystalia.description = Mineral con baja radiactividad, utilizado como munición de fragmentación y almacenamiento de líquidos. Bastante frágil.
item.fenadi-i06-lizandri.name = Lizandri
item.fenadi-i06-lizandri.description = Una aleación ideal para estructuras defensivas, transporte de fluidos y reforzamiento de muchas estructuras. Bastante irregular.
item.fenadi-i07-advanced-mass.name = Masa Avanzada
item.fenadi-i07-advanced-mass.description = Un compuesto más resistente que conserva sus propiedades moldeables, utilizado en todas las estructuras avanzadas. Bastante denso.
item.fenadi-i08-igneous-crystalia.name = Cristalia Ígnea
item.fenadi-i08-igneous-crystalia.description = Cristales infundidos con calor extremo, utilizados como munición de fragmentación ígneo, estructuras reactivas y la fabricación de otros recursos. Muy ardiente.
item.fenadi-i09-lavago.name = Lagavo
item.fenadi-i09-lagavo.description = Un mineral extremadamente peligroso debido a su radiactividad, se utiliza como combustible nuclear, reforzamiento de muchas estructuras avanzadas, munición densa y corrupta. Ideal para la fabricación de diversas aleaciones futuras. Altamente radiactivo.
item.fenadi-i10-optical-fiber.name = Fibra Óptica
item.fenadi-i10-optical-fiber.description = Aleación ideal como para munición eléctrica, transporte moderno y unidades pesadas. Bastante sobrecargada.
item.fenadi-i11-impure-gold.name = Oro Impuro
item.fenadi-i11-impure-gold.description = Las piezas de oro infectadas por las propiedades nocivas de Lagavo, no tienen ninguna utilidad hasta que se purifiquen adecuadamente.
item.fenadi-i12-gold.name = Oro
item.fenadi-i12-gold.description = Un mineral muy valioso y difícil de extraer, utilizado para la construcción de estructuras muy especiales. Bastante raro.
item.fenadi-i13-complex-mass.name = Masa Compleja
item.fenadi-i13-complex-mass.description = Una masa muy robusta, ideal para la construcción de estructuras muy complejas y edificios especiales. Muy duradera.
item.fenadi-i14-otucium.name = Otucio
item.fenadi-i14-otucium.description = Aleación extremadamente caliente y radiactiva a la vez, utilizada en unidades pesadas y municiones complejas. Muy robusta.
item.fenadi-i15-processor-f08.name = Procesador F08
item.fenadi-i15-processor-f08.description = Un chip lógico con unas cualidades increíbles gracias a los materiales que lo componen, eficiente en CASI todos los aspectos posibles. La causa del desastre.
item.fenadi-i16-complex-fiber.name = Fibra Compleja
item.fenadi-i16-complex-fiber.description = Un recurso valioso con un procesamiento extremo, utilizado en armas robustas, estructuras complejas y unidades pesadas. 
item.fenadi-i17-processor-p41.name = Procesador P41
item.fenadi-i17-processor-p41.description = Un chip lógico de vanguardia capaz de realizar cualquier tarea, el recurso definitivo. Muy codiciado.
item.fenadi-io01-dry-basic-mass.name = Masa Básica Seca.
item.fenadi-io01-dry-basic-mass.description = Una masa que perdió su blandura y ahora está disecada, no sirve para nada al menos que se hidrate.
item.fenadi-io02-drained-crystalia.name = Cristalia Drenada.
item.fenadi-io02-drained-crystalia.description = Un cristal que perdió todas sus propiedades, necesita ser ionizado con un líquido corrosivo.
item.fenadi-io03-extinguished-igneous-crystalia.name = Cristalia Ígnea Apagada.
item.fenadi-io03-extinguished-igneous-crystalia.description = Un cristal que su fuego interior se apagó, necesita un líquido que reviva esa flama. 

# líquidos:

liquid.fenadi-l01-yavama.name = Yavama
liquid.fenadi-l01-yavama.description = Líquido viscoso, utilizado en la reparación de estructuras y la extracción de recursos, y muy eficaz para retener otros líquidos. Bastante pegajoso.
liquid.fenadi-l02-soro.name = Soro
liquid.fenadi-l02-soro.description = Líquido inflamable, utilizado para la generación de energía y como potente potenciador de otros recursos. Bastante inestable.
liquid.fenadi-l03-baruga.name = Baruga
liquid.fenadi-l03-baruga.description = Líquido corrosivo, utilizado para la creación de unidades, la extracción avanzada de recursos y como potente estabilizante de recursos radiactivos. Muy denso.
liquid.fenadi-l04-explosive-liquid.name = Líquido Explosivo
liquid.fenadi-l04-explosive-liquid.description = Un líquido sintetizado altamente peligroso, utilizado en armas avanzadas y reacciones energéticas. Usar bajo supervisión y precaución.
liquid.fenadi-l05-dense-liquid.name = Líquido Denso
liquid.fenadi-l05-dense-liquid.description = Un líquido radiactivo, pesado y denso, utilizado en la construcción de unidades y armamento avanzados, así como en la generación responsable de energía. Es bastante tóxico.
liquid.fenadi-l06-waste-liquid.name = Líquido Residual
liquid.fenadi-l06-waste-liquid.description = Residuos licuados de otros recursos, solo sirven como refrigerante energético. Bastante inútil.
liquid.fenadi-l07-radiant-liquid.name = Líquido Radiante
liquid.fenadi-l07-radiant-liquid.description = Un líquido que fue procesado con un único próposito: refrigerar las torres y estructuras defensivas. Muy ligero.

