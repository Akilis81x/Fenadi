# items:

item.fenadi-i01-basic-mass.name = Basic Mass
item.fenadi-i01-basic-mass.description = A soft and removable resource, abundant throughout Fenadi, used for all basic constructions.
item.fenadi-i02-tinium.name = Tinium
item.fenadi-i02-tinium.description = It is used as slowing ammunition, resource transport, unit manufacturing, and defensive structures. Quite durable.
item.fenadi-i03-elastic-fiber.name = Elastic Fiber
item.fenadi-i03-elastic-fiber.description = It is used in the manufacture of units, electrical infrastructure, and storage systems. It is very flexible.
item.fenadi-i04-debris.name = Debris
item.fenadi-i04-debris.description = They can be separated into fragments from other compressed resources to obtain them.
item.fenadi-i05-crystalia.name = Crystalia
item.fenadi-i05-crystalia.description = Low-reactivity mineral, used as fragmentation ammunition and for liquid storage. Quite brittle.
item.fenadi-i06-lizandri.name = Lizandri
item.fenadi-i06-lizandri.description = An ideal alloy for defensive structures, fluid transport, and reinforcement of many structures. Quite irregular.
item.fenadi-i07-advanced-mass.name = Advanced Mass
item.fenadi-i07-advanced-mass.description = A stronger compound that retains its moldable properties, used in all advanced structures. Quite dense.
item.fenadi-i08-igneous-crystalia.name = Igneous Crystalia
item.fenadi-i08-igneous-crystalia.description = Crystals infused with extreme heat, used as igneous fragmentation munitions, reactive structures, and in the manufacture of other resources. Very hot.
item.fenadi-i09-lavago.name = Lagavo
item.fenadi-i09-lagavo.description = An extremely dangerous mineral due to its radioactivity, it is used as nuclear fuel, for reinforcing many advanced structures, and in dense, corrupted ammunition. Ideal for manufacturing various future alloys. Highly radioactive.
item.fenadi-i10-optical-fiber.name = Optical Fiber
item.fenadi-i10-optical-fiber.description = Ideal alloy for electric ammunition, modern transport, and heavy units. Quite overloaded.
item.fenadi-i11-impure-gold.name = Impure Gold
item.fenadi-i11-impure-gold.description = Gold pieces infected by the harmful properties of Lagavo are useless until they are properly purified.
item.fenadi-i12-gold.name = Gold
item.fenadi-i12-gold.description = A very valuable and difficult-to-extract mineral, used for the construction of very special structures. Quite rare.
item.fenadi-i13-complex-mass.name = Complex Mass
item.fenadi-i13-complex-mass.description = A very robust mass, ideal for the construction of highly complex structures and special buildings. Very durable.
item.fenadi-i14-otucium.name = Otucium
item.fenadi-i14-otucium.description = An extremely hot and radioactive alloy, used in heavy equipment and complex munitions. Very robust.
item.fenadi-i15-processor-f08.name = Processor F08
item.fenadi-i15-processor-f08.description = A logic chip with incredible qualities thanks to its component materials, efficient in almost every possible aspect. The cause of the disaster.
item.fenadi-i16-complex-fiber.name = Complex Fiber
item.fenadi-i16-complex-fiber.description = A valuable resource with extreme processing, used in robust weapons, complex structures, and heavy units.
item.fenadi-i17-processor-p41.name = Processor P41
item.fenadi-i17-processor-p41.description = A cutting-edge logic chip capable of performing any task, the ultimate resource. Highly coveted.
item.fenadi-io01-dry-basic-mass.name = Dry Basic Mass.
item.fenadi-io01-dry-basic-mass.description = A mass that has lost its softness and is now dried out is useless unless it is rehydrated.
item.fenadi-io02-drained-crystalia.name = Drained Crystalia
item.fenadi-io02-drained-crystalia.description = A crystal that has lost all its properties needs to be ionized with a corrosive liquid.
item.fenadi-io03-extinguished-igneous-crystalia.name = Extinguished Igneous Crystalia
item.fenadi-io03-extinguished-igneous-crystalia.description = A crystal whose inner fire has gone out needs a liquid to revive that flame.

# liquids:

liquid.fenadi-l01-yavama.name = Yavama
liquid.fenadi-l01-yavama.description = Viscous liquid, used in structural repair and resource extraction, and very effective at retaining other liquids. Quite sticky.
liquid.fenadi-l02-soro.name = Soro
liquid.fenadi-l02-soro.description = Flammable liquid, used for power generation and as a powerful enhancer of other resources. Quite unstable.
liquid.fenadi-l03-baruga.name = Baruga
liquid.fenadi-l03-baruga.description = Corrosive liquid, used for unit creation, advanced resource extraction, and as a powerful stabilizer for radioactive resources. Very dense.
liquid.fenadi-l04-explosive-liquid.name = Explosive Liquid
liquid.fenadi-l04-explosive-liquid.description = A highly dangerous synthetic liquid used in advanced weapons and energy reactions. Use under supervision and with caution.
liquid.fenadi-l05-dense-liquid.name = Dense Liquid
liquid.fenadi-l05-dense-liquid.description = A heavy, dense, radioactive liquid used in the construction of advanced weapons and equipment, as well as in responsible power generation. It is highly toxic.
liquid.fenadi-l06-waste-liquid.name = Waste Liquid
liquid.fenadi-l06-waste-liquid.description = Liquefied waste from other resources only serves as an energy-saving refrigerant. Pretty useless.
liquid.fenadi-l07-radiant-liquid.name = Radiant Liquid
liquid.fenadi-l07-radiant-liquid.description = A liquid that was processed for a single purpose: to cool the towers and defensive structures. Very light.

# drill:

block.fenadi-DRA0-basic-drill.name = Basic Drill
block.fenadi-DRA0-basic-drill.description = Extracts basic minerals.
block.fenadi-DRA1-elastic-drill.name = Elastic Drill
block.fenadi-DRA1-elastic-drill.description = It subtly extracts some basic minerals.
block.fenadi-DRB0-advanced-drill.name = Advanced Drill
block.fenadi-DRB0-advanced-drill.description = It extracts more sophisticated minerals.
block.fenadi-DRB1-optical-drill.name = Optical Drill
block.fenadi-DRB1-optical-drill.description = It quickly extracts fragile minerals.
block.fenadi-DRB2-basic-hole-punch.name = Basic Hole Punch
block.fenadi-DRB2-basic-hole-punch.description = Extract some basic minerals from the walls.
block.fenadi-DRC0-complex-drill.name = Complex Drill
block.fenadi-DRC0-complex-drill.description = Extracts all hard minerals
block.fenadi-DRC1-golden-hole-punch.name = Golden Hole Punch
block.fenadi-DRC1-golden-hole-punch.description = It extracts large quantities of minerals from the walls.

# turrets:

block.fenadi-TA0-guard.name = Guard
block.fenadi-TA0-guard.description = Fires basic projectiles at all targets.
block.fenadi-TA1-splatter.name = Splatter
block.fenadi-TA1-splatter.description = It fires explosive projectiles that cover a large area at ground targets.
block.fenadi-TA2-fragmenter.name = Fragmenter
block.fenadi-TA2-fragmenter.description = It fires long-range armor-piercing projectiles at all targets.
block.fenadi-TA3-voltage.name = Voltage
block.fenadi-TA3-voltage.description = Unleashes multiple electric arcs at all targets. Requires energy.
block.fenadi-TB0-radiation.name = Radiation
block.fenadi-TB0-radiation.description = It decomposes radioactive materials, releasing their particles over a large area and targeting ground-based objectives. Requires Baruga.
block.fenadi-TB1-optical.name = Optical
block.fenadi-TB1-optical.description = It stores electrical materials to fire an electrical orb that pursues ground targets. It requires energy.
block.fenadi-TB2-plasm.name = Plasm
block.fenadi-TB2-plasm.description = It fires a powerful, penetrating laser beam at all targets. Requires power and coolant.
block.fenadi-TB3-rehash.name = Rehash
block.fenadi-TB3-rehash.description = A powerful flamethrower that incinerates everything in its path. Requires Explosive Liquid.
block.fenadi-TB4-butcher.name = Butcher
block.fenadi-TB4-butcher.description = It fires a powerful explosive projectile that annihilates all ground units, but it has the disadvantage of a blind spot and a slow reload. Requires Explosive Liquid.
block.fenadi-TB5-descend.name = Descend
block.fenadi-TB5-descend.description = It fires a ferocious barrage of anti-aircraft shells.
block.fenadi-TC0-calamity.name = Calamity
block.fenadi-TC0-calamity.description = Uses complex ammunition causing different effects.
block.fenadi-TC1-sprayer.name = Sprayer
block.fenadi-TC1.sprayer.description = Depending on the liquid, it shoots in a different way.
block.fenadi-TC2-punisher.name = Punisher
block.fenadi-TC2-punisher.description = Fires a powerful ground missile.
block.fenadi-TC3-malefic.name = Malefic
block.fenadi-TC3-malefic.description = Fires antimatter projectiles that do a lot of damage.

