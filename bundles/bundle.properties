unit.fenadi-UD2-lure.description = Small vehicle unit, fast with slight damage power.
unit.fenadi-UE2-sturdy.name = Sturdy
unit.fenadi-UE2-sturdy.description = Normal performance siege tank, has a block-piercing cannon.
unit.fenadi-UF2-collapsor.name = Collapsor
unit.fenadi-UF2-collapsor.description = Large, fast, and powerful vehicle.
unit.fenadi-UG2-heavy.name = Heavy
unit.fenadi-UG2-heavy.description = Large tank with high firepower, excellent performance in besieging enemy bases.
unit.fenadi-UH2-fissure.name = Fisure
unit.fenadi-UH2-fissure.description = Large vehicle, generates shockwaves around it that disintegrate everything in their path.
unit.fenadi-UI2-ton.name = Ton
unit.fenadi-UI2-ton.description = [red]There is no hope of survival[]. Gigantic tank, equipped with 2 powerful missile launchers that obliterate anything it detects.
unit.fenadi-UD3-climber.name = Climber
unit.fenadi-UD3-climber.description = Small climbing unit, equipped with a piercing laser.
unit.fenadi-UE3-looter.name = Looter
unit.fenadi-UE3-looter.description = Standard climbing unit, has 2 metal melee arms.
unit.fenadi-UF3-hunter.name = Hunter
unit.fenadi-UF3-hunter.description = Improved climbing unit, now with a powerful fire-piercing laser.
unit.fenadi-UG3-muffler.name = Muffler
unit.fenadi-UG3-muffler.description = Advanced climbing unit, equipped with a deadly incendiary cluster cannon.
unit.fenadi-UH3-dismantler.name = Dismantler
unit.fenadi-UH3-dismantler.description = Large climbing unit, it has a large piercing fire plasma cannon.
unit.fenadi-UI3-claw.name = Claw
unit.fenadi-UI3-claw.description = [network]eminent extermination[]. A unit that does not follow peace orders; peace is achieved by destroying everything in its path.
unit.fenadi-UD4-sum.name = Sum
unit.fenadi-UD4-sum.description = Tiny aerial unit, fast and efficient although weak.
unit.fenadi-UE4-multi.name = Multi
unit.fenadi-UE4-multi.description = Small, fast air siege unit with a better rate of fire.
unit.fenadi-UF4-tentra.name = Tentra
unit.fenadi-UF4-tentra.description = Improved, large, destructive, chaotic air unit that carries a small squadron inside, waiting to be shot down to free itself.
unit.fenadi-UG4-penta.name = Penta
unit.fenadi-UG4-penta.description = Large air unit, great destructive capacity and carries a death squad inside.
unit.fenadi-UH4-potenial.name = Potenial
unit.fenadi-UH4-potenial.description = A drone of considerable size, with lethal laser beams.
unit.fenadi-UI4-omnidrial.name = Omnidrial
unit.fenadi-UI4-omnidrial.description = [red]It's not worth fighting[]. Gigantic drone that rules all airspace without any compassion (if it had any).

# sectores:

sector.fenadi-s01-isolated-valley.name = Isolated Valley.
sector.fenadi-s01-isolated-valley.description = An ideal terrain to secretly recover technology and free the planet from foreign influences.
sector.fenadi-s01-isolated-valley.details = The planet Fenadi was an inhospitable and uninhabitable place for advanced creatures for eons, until the arrival of the conquering federation IFPO (Invading Federation of Primordial Order) to the planet. They deployed 7 factions in different specialties to fulfill the directives given by their superiors called the "Primitives".
sector.fenadi-s02-abandoned-storage-area.name = Abandoned Storage Area
sector.fenadi-s02-abandoned-storage-area.description = A former storage site that once belonged to the gathering faction [blue]Uwile[], is now a completely forgotten but surprisingly intact site, taking advantage of the stored resources in the vaults and researching Elastic Fiber for the development of electrical and unit components.
sector.fenadi-s02-abandoned-storage-area.details = In Era 1: Incursion, once the various factions were established, the Uwile gathering faction was tasked with setting up warehouses in all central areas to receive and store the necessary resources sent to them by the Elder Things from the Planetary Command Station.
sector.fenadi-s03-tinium-cliff.name = Tinium Cliff
sector.fenadi-s03-tinium-cliff.description = This land was once an ideal place to extract absurd quantities of Tinium, now only remains of rubble from old extraction infrastructures, finding a use for it.
sector.fenadi-s03-tinium-cliff.details = In Era 1: Incursion, the [orange]Dengar[] scouting faction deployed across the planet to locate resources and areas of interest for the Elder Things. In their search, they encountered a valuable, albeit somewhat basic, resource: Tinium, a fairly durable and lightweight material abundant across the surface of Fenadi, along with Basic Mass. This discovery proved invaluable for technological advancement during this period.
sector.fenadi-s04-crystallized-rift.name = Crystallized Rift
sector.fenadi-s04-crystallized-rift.description = A region completely isolated from the others, a crystallized biome that offers multiple applications, is protected by a small base that safeguards the qualities that Cristalia provides.
sector.fenadi-s04-crystallized-rift.details = During Era 1: Incursion, the [orange]Dengar[] scout faction was fulfilling its mission to explore every unusual corner of the new planet until it came across a biome unlike any other; one completely crystallized and emitting slight levels of radiation, this discovery impressed everyone.
sector.fenadi-s05-corrupt-pit.name = Corrupt Pit
sector.fenadi-s05-corrupt-pit.description = The ancient records you once made show the experimentation of creating alloys capable of transporting liquids to improve the quality of life of the machines, it requires a wide variety of units to take out this enemy base that produces Lizandri.
sector.fenadi-s05-corrupt-pit.details =
sector.fenadi-s06-collapsed-retaining-wall.name = Collapsed Retaining Wall
sector.fenadi-s06-collapsed-retaining-wall.description = Now what remains of these stalls are pure ruins that were razed, according to a record that was saved, a precious and very useful liquid called "Yavama" can be recovered.
sector.fenadi-s06-collapsed-retaining-wall.details = During "Era 1: Incursion," numerous outposts were established across the planet to contain the threat of the "Ryjux," autonomous creatures from Fenadi. These beings, thanks to their strength and rapid reproduction rate, became the sole inhabitants of this celestial body before the arrival of FIOP.
sector.fenadi-s07-chemical-synthesis-plant.name = Chemical Synthesis Plant
sector.fenadi-s07-chemical-synthesis-plant.description = In this industrial zone full of natural deposits of Yavama, it was the place where 2 other natural liquids of the planet were discovered: Soro and Baruga.
sector.fenadi-s07-chemical-synthesis-plant.details = As the other factions began to settle on the celestial body, they discovered a peculiarity the planet held: the existence of two extremely important liquids, Soro and Baruga, with characteristics unique until that moment. One is incredibly flammable but acts as a powerful enhancer for other resources, and the other is highly corrosive but capable of controlling the radioactivity generated by certain resources. Their discovery unlocked a new level of processing and interaction with other resources.
sector.fenadi-s08-basic-operation-center.name = Basic Operation Center
sector.fenadi-s08-basic-operation-center.description = As time passed and experimentation with new technologies and resources continued, the need arose for better structures that offered many more advantages, so they created the essential "Advanced Mass." This research institute now fiercely defends the building capable of creating the necessary Advanced Mass.
sector.fenadi-s08-basic-operation-center.details =
