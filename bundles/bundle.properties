# productores:

block.fenadi-PRA0-elasticity-fuser.name = Elasticity Fuser
block.fenadi-PRA0-elasticity-fuser.description = It produces Elastic Fiber by combining the hardness of Tinium with the flexibility of the Basic Mass.
block.fenadi-PRA1-molding-machine.name = Molding Machine
block.fenadi-PRA1-molding-machine.description = Create Basic Mass by pulverizing a pile of rubble.
block.fenadi-PRA2-decompressor.name = Decompressor
block.fenadi-PRA2-decompressor.description = Extract basic resources from a pile of rubble.
block.fenadi-PRA3-furnace-ferocity.name = Furnace of Ferocity
block.fenadi-PRA3-furnace-ferocity.description = It fuses the hardness of Tinium and the fragility of Crystalia to produce Lizandri.
block.fenadi-PRA4-casting-chamber.name = Casting Chamber
block.fenadi-PRA4-casting-chamber.description = Melt soft materials to produce Yavama.
block.fenadi-PRA5-igneous-concentrator.name = Igneous Concentrator
block.fenadi-PRA5-igneous-concentrator.description = It collects the Soro from the atmosphere and converts it into liquid. It works best in hot soil.
block.fenadi-PRA6-corrosive-concentrator.name = Corrosive Concentrator
block.fenadi-PRA6-corrosive-concentrator.description = It collects Baruga from the subsoil and converts it into liquid. It works best in radioactive terrain.
block.fenadi-PRB0-advanced-synthesizer.name = Advanced Synthesizer
block.fenadi-PRB0-advanced-synthesizer.description = It solidifies the mass and transforms it into a denser one. It requires Soro to function.
block.fenadi-PRB1-intensive-blender.name = Intensive Blender
block.fenadi-PRB1-intensive-blender.description = Liquefy the Soro with crystals and produce a very powerful liquid with explosive capabilities.
block.fenadi-PRB2-plasticizer.name = Plasticizer
block.fenadi-PRB2-plasticizer.description = It produces more Elastic Fiber in exchange for consuming more materials. It also produces Yavama as a byproduct.
block.fenadi-PRB3-aggressive-forge.name = Aggressive Forge
block.fenadi-PRB3-aggressive-forge.description = Produce more Lizandri in exchange for consuming more materials.
block.fenadi-PRB4-viscosity-blender.name = Viscosity Blender
block.fenadi-PRB4-viscosity-blender.description = It melts soft materials much faster and more efficiently to produce more Yavama.
block.fenadi-PRB5-precision-fuser.name = Precision Fuser
block.fenadi-PRB5-precision-fuser.description = Significantly improves Elastic Fiber and reduces Optical Fiber overload. Requires Soro to function.
block.fenadi-PRB6-toxicity-mixer.name = Toxicity Mixer
block.fenadi-PRB6-toxicity-mixer.description = Mix radioactive materials with harmful liquids.
block.fenadi-PRB7-golden-purifier.name = Golden Purifier
block.fenadi-PRB7-golden-purifier.description = It cleans the impure gold collected from the plateau into a more acceptable gold.
block.fenadi-PRC0-complex-synthesizer.name = Complex Synthesizer
block.fenadi-PRC0-complex-synthesizer.description = The ultimate synthesizer, it creates an incredibly durable mass. It produces waste liquid as a byproduct.
block.fenadi-PRC1-impact-filter.name = Impact Filter
block.fenadi-PRC1-impact-filtar.description = Extrae recursos valiosos de enormes cantidades de escombros.
block.fenadi-PRC2-otucium-collider.name = Otucium Collider
block.fenadi-PRC2-otucium-collider.description = It produces a robust material from flammable and radioactive elements. It produces waste liquid as a byproduct.
block.fenadi-PRC3-reflective-chamber.name = Reflective Chamber
block.fenadi-PRC3-reflective-chamber.description = It produces more Optical Fiber in exchange for consuming more materials.
block.fenadi-PRC4-logical-catalyst.name = Logical Catalyst
block.fenadi-PRC4-logical-catalyst.description = Manufacture a processor with incredible capabilities.
block.fenadi-PRC5-complex-fuser.name = Complex Fuser
block.fenadi-PRC5-complex-fuser.description = It refines optical fiber and subjects it to extreme environments to create complex fiber. It produces a lot of waste liquid as a byproduct.
block.fenadi-PRC6-quantum-catalyst.name = Quantum Catalyst
block.fenadi-PRC6-quantum-catalyst.description = It manufactures a powerful and complex processor that can be used for multiple purposes.

# units

unit.fenadi-UD0-advocate.name = Advocate
unit.fenadi-UD0-advocate.description = Basic flagship unit at the start of sieges.    
