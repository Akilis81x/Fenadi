unit.fenadi-UF1-collector.name = Collector
unit.fenadi-UF1-collector.description = Standard support unit, equipped with twin pistols and a light propeller.
unit.fenadi-UG1-supervisor.name = Supervisor
unit.fenadi-UG1-supervisor.description = Advanced support unit, equipped with a healing missile launcher and a very fast propeller.
